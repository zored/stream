name: ci

on:
  push:
  pull_request:

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make pages
      - run: git diff --exit-code companion

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vkcall/go.mod
          cache-dependency-path: |
            tools/vkcall/go.sum
            tools/zstreamd/go.sum
      - run: make build
